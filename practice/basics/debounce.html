<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>React Debounce Search</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        background: #f4f4f4;
      }

      .container {
        width: 500px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
      }

      input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        box-sizing: border-box;
      }

      .loading {
        margin-top: 15px;
      }

      .result {
        margin-top: 20px;
      }

      .user {
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function SearchBox() {
        const [text, setText] = useState("");
        const [results, setResults] = useState([]);
        const [loading, setLoading] = useState(false);

        useEffect(() => {
          // Don't call API when input is empty
          if (!text.trim()) {
            setResults([]);
            return;
          }

          // Wait 500ms after the last keystroke
          const timer = setTimeout(async () => {
            try {
              setLoading(true);

              const response = await fetch(
                `https://jsonplaceholder.typicode.com/users?name=${encodeURIComponent(text)}`
              );

              const data = await response.json();

              setResults(data);
            } catch (error) {
              console.error("API error:", error);
            } finally {
              setLoading(false);
            }
          }, 500);

          // Cancel previous timer when text changes
          return () => clearTimeout(timer);
        }, [text]);

        return (
          <div className="container">
            <h2>Debounced User Search</h2>

            <input
              type="text"
              placeholder="Search user..."
              value={text}
              onChange={(e) => setText(e.target.value)}
            />

            {loading && (
              <div className="loading">
                Searching...
              </div>
            )}

            <div className="result">
              {results.map((user) => (
                <div className="user" key={user.id}>
                  <strong>{user.name}</strong>
                  <br />
                  {user.email}
                </div>
              ))}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(
        document.getElementById("root")
      );

      root.render(<SearchBox />);
    </script>
  </body>
</html>
