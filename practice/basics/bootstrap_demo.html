<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React + Bootstrap Components</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-light">

    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="text/babel">
      const {useState, useEffect} = React;

      function Navbar(){
        return(
          <nav className="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div className="container">
              <a className="navbar-brand fw-bold">React UI Kit</a>
              <button className="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
                <span className="navbar-toggler-icon"></span>
              </button>
              <div id="nav" className="collapse navbar-collapse">
                <ul className="navbar-nav ms-auto">
                  <li className="nav-item"><a className="nav-link" href="#cards">Cards</a></li>
                  <li className="nav-item"><a className="nav-link" href="#forms">Forms</a></li>
                  <li className="nav-item"><a className="nav-link" href="#table">Table</a></li>
                </ul>
              </div>
            </div>
          </nav>
        )
      }

      function Hero(){
        return(
          <div className="bg-primary text-white py-5">
            <div className="container text-center">
              <h1 className="display-4 fw-bold">React + Bootstrap Components</h1>
              <p className="lead">Reusable UI built using React functional components.</p>
              <button className="btn btn-warning btn-lg">Get Started</button>
            </div>
          </div>
        )
      }

      function Alerts(){
        return(
          <div className="container mt-4">
            <h3>Alerts</h3>
            <div className="alert alert-success">Success Alert</div>
            <div className="alert alert-danger">Danger Alert</div>
            <div className="alert alert-warning">Warning Alert</div>
            <div className="alert alert-info">Info Alert</div>
          </div>
        )
      }

      function Buttons(){
        return(
          <div className="container mt-4">
            <h3>Buttons</h3>
            <div className="d-flex flex-wrap gap-2 mb-3">
              <button className="btn btn-primary">Primary</button>
              <button className="btn btn-secondary">Secondary</button>
              <button className="btn btn-success">Success</button>
              <button className="btn btn-danger">Danger</button>
              <button className="btn btn-warning">Warning</button>
              <button className="btn btn-info">Info</button>
              <button className="btn btn-dark">Dark</button>
            </div>

            <div className="btn-group">
              <button className="btn btn-outline-primary">Left</button>
              <button className="btn btn-outline-primary">Middle</button>
              <button className="btn btn-outline-primary">Right</button>
            </div>
          </div>
        )
      }

      function Badges(){
        return(
          <div className="container mt-4">
            <h3>Badges</h3>
            <h4>Notifications <span className="badge bg-danger">9</span></h4>
            <span className="badge bg-primary me-2">Rails</span>
            <span className="badge bg-success me-2">React</span>
            <span className="badge bg-dark">Bootstrap</span>
          </div>
        )
      }

      function Cards(){
        const items=[1,2,3];
        return(
          <div className="container mt-4" id="cards">
            <h3>Cards</h3>
            <div className="row g-4">
              {items.map(i=>(
                <div className="col-md-4" key={i}>
                  <div className="card shadow-sm h-100">
                    <img src={`https://picsum.photos/300/200?random=${i}`} className="card-img-top"/>
                    <div className="card-body">
                      <h5 className="card-title">Card {i}</h5>
                      <p className="card-text">Reusable Bootstrap card rendered using React map().</p>
                      <button className="btn btn-primary">View</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )
      }

      function Accordion(){
        return(
          <div className="container mt-5">
            <h3>Accordion</h3>
            <div className="accordion" id="acc">
              {[1,2,3].map(i=>(
                <div className="accordion-item" key={i}>
                  <h2 className="accordion-header">
                    <button className={`accordion-button ${i!==1?'collapsed':''}`} data-bs-toggle="collapse" data-bs-target={`#item${i}`}>
                      Section {i}
                    </button>
                  </h2>
                  <div id={`item${i}`} className={`accordion-collapse collapse ${i===1?'show':''}`} data-bs-parent="#acc">
                    <div className="accordion-body">Content for section {i}.</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )
      }

      function Tabs(){
        const [tab,setTab]=useState('home');
        return(
          <div className="container mt-5">
            <h3>Tabs (React State)</h3>
            <ul className="nav nav-tabs">
              {['home','profile','contact'].map(t=>(
                <li className="nav-item" key={t}>
                  <button className={`nav-link ${tab===t?'active':''}`} onClick={()=>setTab(t)}>{t}</button>
                </li>
              ))}
            </ul>
            <div className="border p-3 bg-white">
              {tab==='home' && <p>Home Content</p>}
              {tab==='profile' && <p>Profile Content</p>}
              {tab==='contact' && <p>Contact Content</p>}
            </div>
          </div>
        )
      }

      function Progress(){
        return(
          <div className="container mt-5">
            <h3>Progress Bars</h3>
            <div className="progress mb-3"><div className="progress-bar" style={{width:'25%'}}>25%</div></div>
            <div className="progress mb-3"><div className="progress-bar bg-success" style={{width:'60%'}}>60%</div></div>
            <div className="progress"><div className="progress-bar bg-danger progress-bar-striped progress-bar-animated" style={{width:'90%'}}>90%</div></div>
          </div>
        )
      }

      function TableComponent(){
        const users=[
          {id:1,name:'Satish',role:'Rails'},
          {id:2,name:'John',role:'React'},
          {id:3,name:'Sara',role:'Python'}
        ];
        return(
          <div className="container mt-5" id="table">
            <h3>Responsive Table</h3>
            <div className="table-responsive">
              <table className="table table-striped table-hover bg-white">
                <thead className="table-dark">
                  <tr><th>ID</th><th>Name</th><th>Role</th></tr>
                </thead>
                <tbody>
                  {users.map(u=>(
                    <tr key={u.id}>
                      <td>{u.id}</td>
                      <td>{u.name}</td>
                      <td>{u.role}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )
      }

      function Forms(){
        const [form,setForm]=useState({name:'',email:'',role:'Rails'});

        const handle=e=>setForm({...form,[e.target.name]:e.target.value});

        const submit=e=>{
          e.preventDefault();
          alert(JSON.stringify(form,null,2));
        }

        return(
          <div className="container mt-5" id="forms">
            <h3>Bootstrap Form</h3>
            <form className="row g-3" onSubmit={submit}>
              <div className="col-md-6">
                <label className="form-label">Name</label>
                <input name="name" className="form-control" onChange={handle}/>
              </div>
              <div className="col-md-6">
                <label className="form-label">Email</label>
                <input type="email" name="email" className="form-control" onChange={handle}/>
              </div>
              <div className="col-md-6">
                <label className="form-label">Role</label>
                <select name="role" className="form-select" onChange={handle}>
                  <option>Rails</option>
                  <option>React</option>
                  <option>Python</option>
                </select>
              </div>
              <div className="col-12 form-check ms-2">
                <input type="checkbox" className="form-check-input"/>
                <label className="form-check-label">Accept Terms</label>
              </div>
              <div className="col-12">
                <button className="btn btn-success">Submit</button>
              </div>
            </form>
          </div>
        )
      }

      function Dropdown(){
        return(
          <div className="container mt-5">
            <h3>Dropdown</h3>
            <div className="dropdown">
              <button className="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Choose</button>
              <ul className="dropdown-menu">
                <li><a className="dropdown-item">React</a></li>
                <li><a className="dropdown-item">Rails</a></li>
                <li><a className="dropdown-item">Python</a></li>
              </ul>
            </div>
          </div>
        )
      }

      function ListGroup(){
        return(
          <div className="container mt-5">
            <h3>List Group</h3>
            <ul className="list-group">
              <li className="list-group-item active">Dashboard</li>
              <li className="list-group-item">Users</li>
              <li className="list-group-item">Reports</li>
              <li className="list-group-item">Settings</li>
            </ul>
          </div>
        )
      }

      function Pagination(){
        return(
          <div className="container mt-5">
            <h3>Pagination</h3>
            <nav>
              <ul className="pagination">
                <li className="page-item"><a className="page-link">Previous</a></li>
                <li className="page-item active"><a className="page-link">1</a></li>
                <li className="page-item"><a className="page-link">2</a></li>
                <li className="page-item"><a className="page-link">Next</a></li>
              </ul>
            </nav>
          </div>
        )
      }

      function Spinner(){
        return(
          <div className="container mt-5">
            <h3>Spinners</h3>
            <div className="spinner-border text-primary me-3"></div>
            <div className="spinner-grow text-success"></div>
          </div>
        )
      }

      function Modal(){
        return(
          <div className="container mt-5">
            <h3>Modal</h3>
            <button className="btn btn-primary" data-bs-toggle="modal" data-bs-target="#demoModal">Open Modal</button>

            <div className="modal fade" id="demoModal">
              <div className="modal-dialog">
                <div className="modal-content">
                  <div className="modal-header">
                    <h5 className="modal-title">React Modal</h5>
                    <button className="btn-close" data-bs-dismiss="modal"></button>
                  </div>
                  <div className="modal-body">This is Bootstrap modal inside React.</div>
                  <div className="modal-footer">
                    <button className="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )
      }

      function Toast(){
        useEffect(()=>{
          const el=document.getElementById('toast');
          const toast=new bootstrap.Toast(el);
          toast.show();
        },[])

        return(
          <div className="position-fixed bottom-0 end-0 p-3">
            <div id="toast" className="toast">
              <div className="toast-header">
                <strong className="me-auto">React</strong>
              </div>
              <div className="toast-body">Bootstrap Toast Loaded</div>
            </div>
          </div>
        )
      }

      function Carousel(){
        return(
          <div className="container mt-5">
            <h3>Carousel</h3>
            <div id="slider" className="carousel slide">
              <div className="carousel-inner rounded">
                {[1,2,3].map((i,index)=>(
                  <div className={`carousel-item ${index===0?'active':''}`} key={i}>
                    <img src={`https://picsum.photos/900/300?random=${i+10}`} className="d-block w-100"/>
                  </div>
                ))}
              </div>
              <button className="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
                <span className="carousel-control-prev-icon"></span>
              </button>
              <button className="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
                <span className="carousel-control-next-icon"></span>
              </button>
            </div>
          </div>
        )
      }

      function Footer(){
        return(
          <footer className="bg-dark text-white text-center py-4 mt-5">
            <p className="mb-0">© 2026 React Bootstrap Component Library</p>
          </footer>
        )
      }

      function App(){
        return(
          <>
            <Navbar/>
            <Hero/>
            <Alerts/>
            <Buttons/>
            <Badges/>
            <Cards/>
            <Accordion/>
            <Tabs/>
            <Progress/>
            <TableComponent/>
            <Forms/>
            <Dropdown/>
            <ListGroup/>
            <Pagination/>
            <Spinner/>
            <Carousel/>
            <Modal/>
            <Footer/>
            <Toast/>
          </>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>

  </body>
</html>
