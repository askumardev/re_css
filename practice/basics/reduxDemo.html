<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>React + Redux Demo</title>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Redux -->
    <script src="https://unpkg.com/redux@4.2.1/dist/redux.min.js"></script>
    <script src="https://unpkg.com/react-redux@8.1.3/dist/react-redux.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      *{
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
      }

      body{
        background:#f4f6f9;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
      }

      .card{
        width:420px;
        background:#fff;
        border-radius:10px;
        padding:24px;
        box-shadow:0 4px 12px rgba(0,0,0,.12);
      }

      h2{
        text-align:center;
        margin-top:0;
      }

      .count{
        font-size:48px;
        font-weight:bold;
        text-align:center;
        color:#2563eb;
        margin:20px 0;
      }

      .buttons{
        display:flex;
        gap:10px;
        justify-content:center;
        margin-bottom:20px;
      }

      button{
        border:none;
        padding:10px 18px;
        border-radius:6px;
        cursor:pointer;
        color:#fff;
        font-size:15px;
      }

      .inc{ background:#16a34a; }
      .dec{ background:#dc2626; }
      .reset{ background:#64748b; }

      .history{
        margin-top:15px;
        border-top:1px solid #ddd;
        padding-top:15px;
      }

      ul{
        padding-left:18px;
        margin:8px 0 0;
      }
    </style>
  </head>
  <body>

  <div id="root"></div>

  <script type="text/babel">

  const { createStore } = Redux;
  const { Provider, useSelector, useDispatch } = ReactRedux;

  /* ---------------- ACTION TYPES ---------------- */

  const INCREMENT = "INCREMENT";
  const DECREMENT = "DECREMENT";
  const RESET     = "RESET";

  /* ---------------- ACTION CREATORS ---------------- */

  const increment = () => ({ type: INCREMENT });
  const decrement = () => ({ type: DECREMENT });
  const reset     = () => ({ type: RESET });

  /* ---------------- INITIAL STATE ---------------- */

  const initialState = {
    count: 0,
    history: []
  };

  /* ---------------- REDUCER ---------------- */

  function counterReducer(state = initialState, action){
    switch(action.type){

      case INCREMENT:
        return {
          count: state.count + 1,
          history: [...state.history, "Increment"]
        };

      case DECREMENT:
        return {
          count: state.count - 1,
          history: [...state.history, "Decrement"]
        };

      case RESET:
        return {
          count: 0,
          history: [...state.history, "Reset"]
        };

      default:
        return state;
    }
  }

  /* ---------------- STORE ---------------- */

  const store = createStore(counterReducer);

  /* ---------------- COMPONENT ---------------- */

  function Counter(){

    const count = useSelector(state => state.count);
    const history = useSelector(state => state.history);

    const dispatch = useDispatch();

    return (
      <div className="card">

        <h2>React + Redux Counter</h2>

        <div className="count">{count}</div>

        <div className="buttons">
          <button
            className="inc"
            onClick={() => dispatch(increment())}>
            + Increment
          </button>

          <button
            className="dec"
            onClick={() => dispatch(decrement())}>
            - Decrement
          </button>

          <button
            className="reset"
            onClick={() => dispatch(reset())}>
            Reset
          </button>
        </div>

        <div className="history">
          <strong>Redux History</strong>

          <ul>
            {history.map((item,index) => (
              <li key={index}>{item}</li>
            ))}
          </ul>
        </div>

      </div>
    );
  }

  /* ---------------- APP ---------------- */

  function App(){
    return (
      <Provider store={store}>
        <Counter/>
      </Provider>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);

  </script>

  </body>
</html>
