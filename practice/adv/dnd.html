<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React-style Drag and Drop</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
      }

      .container {
        max-width: 1000px;
        margin: 50px auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
      }

      .board {
        display: flex;
        gap: 30px;
        justify-content: center;
      }

      .column {
        width: 400px;
        min-height: 500px;
        padding: 20px;
        background: #e9ecef;
        border-radius: 10px;
      }

      .column.drag-over {
        background: #dbeafe;
      }

      .column h2 {
        margin-top: 0;
        text-align: center;
      }

      .card {
        padding: 18px;
        margin-bottom: 12px;
        background: white;
        border-radius: 8px;
        cursor: grab;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: transform 0.15s, opacity 0.15s;
      }

      .card:hover {
        transform: translateY(-2px);
      }

      .card.dragging {
        opacity: 0.4;
      }

      .card h3 {
        margin: 0 0 8px;
      }

      .card p {
        margin: 0;
        color: #666;
      }

      .placeholder {
        height: 70px;
        margin-bottom: 12px;
        border: 2px dashed #999;
        border-radius: 8px;
        background: #f8f9fa;
      }
    </style>
  </head>

  <body>

    <div class="container">
      <h1>Drag and Drop Board</h1>
      <div class="board">
        <div
          class="column"
          id="todo"
          data-column="todo"
        >
          <h2>Todo</h2>

          <div
            class="card"
            draggable="true"
            data-id="1"
          >
            <h3>Learn React</h3>
            <p>Understand React fundamentals</p>
          </div>

          <div
            class="card"
            draggable="true"
            data-id="2"
          >
            <h3>Learn Redux</h3>
            <p>Understand state management</p>
          </div>

          <div
            class="card"
            draggable="true"
            data-id="3"
          >
            <h3>Build Project</h3>
            <p>Create a React application</p>
          </div>
        </div>


        <div
          class="column"
          id="completed"
          data-column="completed"
        >
          <h2>Completed</h2>

          <div
            class="card"
            draggable="true"
            data-id="4"
          >
            <h3>Learn JavaScript</h3>
            <p>Complete JavaScript basics</p>
          </div>

          <div
            class="card"
            draggable="true"
            data-id="5"
          >
            <h3>Learn HTML</h3>
            <p>Complete HTML fundamentals</p>
          </div>
        </div>

      </div>
    </div>


    <script>
      let draggedCard = null;

      const cards = document.querySelectorAll(".card");
      const columns = document.querySelectorAll(".column");


      // -----------------------------------
      // Drag Start
      // -----------------------------------

      cards.forEach(card => {

        card.addEventListener("dragstart", event => {

          draggedCard = card;

          card.classList.add("dragging");

          event.dataTransfer.effectAllowed = "move";

          event.dataTransfer.setData(
            "text/plain",
            card.dataset.id
          );
        });


        // -----------------------------------
        // Drag End
        // -----------------------------------

        card.addEventListener("dragend", () => {

          card.classList.remove("dragging");

          columns.forEach(column => {
            column.classList.remove("drag-over");
          });

          draggedCard = null;
        });

      });


      // -----------------------------------
      // Drag Over
      // -----------------------------------

      columns.forEach(column => {

        column.addEventListener("dragover", event => {

          event.preventDefault();

          column.classList.add("drag-over");

          const afterElement = getDragAfterElement(
            column,
            event.clientY
          );

          if (afterElement == null) {

            column.appendChild(draggedCard);

          } else {

            column.insertBefore(
              draggedCard,
              afterElement
            );

          }

        });


        // -----------------------------------
        // Drag Leave
        // -----------------------------------

        column.addEventListener("dragleave", event => {

          if (!column.contains(event.relatedTarget)) {
            column.classList.remove("drag-over");
          }

        });


        // -----------------------------------
        // Drop
        // -----------------------------------

        column.addEventListener("drop", event => {

          event.preventDefault();

          column.classList.remove("drag-over");

          const cardId =
            event.dataTransfer.getData("text/plain");

          const card = document.querySelector(
            `.card[data-id="${cardId}"]`
          );

          if (!card) {
            return;
          }

          const afterElement = getDragAfterElement(
            column,
            event.clientY
          );

          if (afterElement == null) {

            column.appendChild(card);

          } else {

            column.insertBefore(
              card,
              afterElement
            );

          }

          console.log(
            `Card ${cardId} moved to ${column.dataset.column}`
          );

          printBoardState();
        });

      });


      // -----------------------------------
      // Find element after cursor
      // -----------------------------------

      function getDragAfterElement(column, y) {

        const draggableElements = [
          ...column.querySelectorAll(
            ".card:not(.dragging)"
          )
        ];

        return draggableElements.reduce(
          (closest, child) => {

            const box =
              child.getBoundingClientRect();

            const offset =
              y - box.top - box.height / 2;

            if (
              offset < 0 &&
              offset > closest.offset
            ) {

              return {
                offset: offset,
                element: child
              };

            } else {

              return closest;
            }

          },
          {
            offset: Number.NEGATIVE_INFINITY,
            element: null
          }
        ).element;
      }


      // -----------------------------------
      // Print current board state
      // -----------------------------------

      function printBoardState() {

        const state = {};

        columns.forEach(column => {

          const columnName =
            column.dataset.column;

          const cards =
            [...column.querySelectorAll(".card")]
              .map(card => card.dataset.id);

          state[columnName] = cards;

        });

        console.log("Current board state:", state);
      }

    </script>

  </body>
</html>
