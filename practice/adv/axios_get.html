<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axios GET Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
   
  </head>
  <body>
    <main>
      <h1>Axios GET Demo</h1>
      <button id="get-button" type="button">Load all products</button>
      <section id="output" aria-live="polite">
        <p>Click the button to load a product.</p>
      </section>
    </main>

    <script>
      const output = document.querySelector('#output');

      async function getProducts() {
        try {
          const response = await axios.get('https://dummyjson.com/products');
          const table = document.createElement('table');
          const tableHead = document.createElement('thead');
          const headingRow = document.createElement('tr');
          const tableBody = document.createElement('tbody');

          ['ID', 'Title', 'Description', 'Price'].forEach((heading) => {
            const cell = document.createElement('th');
            cell.scope = 'col';
            cell.textContent = heading;
            headingRow.append(cell);
          });
          tableHead.append(headingRow);

          response.data.products.forEach((product) => {
            const row = document.createElement('tr');
            [product.id, product.title, product.description, product.price].forEach((value) => {
              const cell = document.createElement('td');
              cell.textContent = value;
              row.append(cell);
            });
            tableBody.append(row);
          });

          table.append(tableHead, tableBody);
          output.replaceChildren(table);
        } catch (error) {
          const message = document.createElement('p');
          message.textContent = `Request failed: ${error.message}`;
          output.replaceChildren(message);
          console.error('GET request failed:', error);
        }
      }

      document.querySelector('#get-button').addEventListener('click', getProducts);
    </script>
  </body>
</html>
