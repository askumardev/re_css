<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Theme Switcher</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        transition: background-color 0.3s, color 0.3s;
      }

      .app {
        min-height: 100vh;
        padding: 40px;
        transition: background-color 0.3s, color 0.3s;
      }

      /* Light theme */
      .light {
        background-color: #ffffff;
        color: #222222;
      }

      /* Dark theme */
      .dark {
        background-color: #121212;
        color: #ffffff;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        margin-bottom: 30px;
      }

      .light button {
        background-color: #222222;
        color: #ffffff;
      }

      .dark button {
        background-color: #ffffff;
        color: #222222;
      }

      .card {
        padding: 30px;
        border-radius: 10px;
        border: 1px solid;
      }

      .light .card {
        background-color: #f5f5f5;
        border-color: #dddddd;
      }

      .dark .card {
        background-color: #1e1e1e;
        border-color: #444444;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- React CDN -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js">
    </script>

    <!-- ReactDOM CDN -->
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>

    <!-- Babel CDN so JSX works directly in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

      function App() {
        const [theme, setTheme] = React.useState("light");

        const toggleTheme = () => {
          setTheme(prevTheme =>
            prevTheme === "light" ? "dark" : "light"
          );
        };

        return (
          <div className={`app ${theme}`}>
            <div className="container">

              <button onClick={toggleTheme}>
                {theme === "light"
                  ? "Switch to Dark"
                  : "Switch to Light"}
              </button>

              <h1>React Theme Switcher</h1>

              <div className="card">
                <h2>
                  Current Theme: {theme}
                </h2>

                <p>
                  This page is using React state to switch
                  between light and dark themes.
                </p>
              </div>

            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(
        document.getElementById("root")
      );

      root.render(<App />);

    </script>

  </body>
</html>
