<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Projects</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .panel {
        width: min(720px, 100%);
        background: #ffffff;
        border-radius: 32px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.1);
        padding: 36px 32px;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: clamp(2rem, 3vw, 2.8rem);
      }
      p {
        margin: 0 0 28px;
        color: #475569;
        line-height: 1.7;
      }
      .project-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 16px;
      }
      .project-list a {
        display: block;
        padding: 18px 22px;
        border-radius: 18px;
        background: #eef2ff;
        color: #1e40af;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .project-list a:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(59, 130, 246, 0.16);
      }
      .hint {
        margin-top: 24px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Sample Projects</h1>
      <p>Choose a sample app to open its index page. Each project runs as a standalone Parcel sample.</p>
      <ul class="project-list">
        <li><a id="link-foodora" href="http://localhost:5002" target="_blank" rel="noreferrer">Foodora Sample (port 5000)</a></li>
        <li><a id="link-bistro" href="http://localhost:5002" target="_blank" rel="noreferrer">Bistro Sample (port 5001)</a></li>
      </ul>
      <script>
        // Try dev server first, fall back to repository-relative index.html
        function ping(url, timeout = 700) {
          return Promise.race([
            fetch(url, { method: 'HEAD', mode: 'no-cors' }).then(() => true).catch(() => false),
            new Promise((res) => setTimeout(() => res(false), timeout))
          ]);
        }

        (async function setupLinks(){
          const foodoraDev = 'http://localhost:5000';
          const bistroDev = 'http://localhost:5001';
          const foodoraStatic = '../foodora/index.html';
          const bistroStatic = '../bistro/index.html';

          try {
            const f = await ping(foodoraDev);
            const b = await ping(bistroDev);
            const lf = document.getElementById('link-foodora');
            const lb = document.getElementById('link-bistro');
            if (!f) lf.href = foodoraStatic;
            if (!b) lb.href = bistroStatic;
          } catch (e) {
            // noop — keep defaults
          }
        })();
      </script>
      <p class="hint">If you want to run the sample locally, use <code>npm run foodora</code> or <code>npm run bistro</code>.</p>
    </div>
  </body>
</html>
